name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Releases run this first, so nothing ships that fails it.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Token check
        run: pnpm check:tokens

      - name: Unit tests
        run: pnpm test

      - name: Build (Chrome)
        run: pnpm build

      - name: Build (Firefox)
        run: pnpm build:firefox

      # The website and the smoke test read the committed copy.
      - name: Features manifest is current
        run: |
          pnpm generate:features-manifest
          git diff --exit-code website/src/data/features.json

      - name: Build sidecar image
        run: docker build -f docker/Dockerfile .
